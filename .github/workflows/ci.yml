name: CI

# Runs automatically on every push and on every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is end-of-life and has no build for the Ubuntu 26.04 runner,
        # so 3.10 is the oldest supported version.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Lint (syntax errors and undefined names)
        run: flake8 . --select=E9,F63,F7,F82 --exclude=.venv,venv,.codex-test-deps --show-source --statistics

      - name: Run unit and endpoint tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        run: |
          for file in static/js/*.js; do node --input-type=module --check < "$file"; done

      - name: Run JavaScript tests
        run: node --test "tests/js/*.test.mjs"
